<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Curtain — S3 preview</title>
<style>
body{font-family:Arial,sans-serif;margin:24px;background:#f4f4f4}
h1{font-size:22px}.row{display:flex;gap:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #ccc;padding:12px;width:300px}
.badge{font-weight:bold;padding:2px 8px;border-radius:4px}
.refused{background:#fdd}.released{background:#dfd}
img{width:100%;border:1px solid #999}
</style>
</head>
<body>
<h1>Curtain — walking skeleton (static preview, no server)</h1>
<div class="row" id="r"></div>
<script>
// Results inlined by scripts/skeleton.mjs. No fetch: works from file://
// and in a fresh clone. Images resolve to ../corpus/img/ from preview/.
const items = /*__RESULTS__*/;
const d = document.getElementById("r");
for (const it of items) {
  const c = document.createElement("div");
  c.className = "card";
  const badge = document.createElement("span");
  badge.className = "badge " + it.verdict;
  badge.textContent = it.verdict.toUpperCase();
  const title = document.createElement("b");
  title.textContent = " " + it.name;
  const img = document.createElement("img");
  img.src = "../corpus/img/" + it.name + ".png";
  img.alt = it.name;
  const leaks = document.createElement("div");
  leaks.textContent = "leaks: " + (it.leaks.join("; ") || "(none)");
  c.append(badge, title, document.createElement("br"), img, document.createElement("br"), leaks);
  d.appendChild(c);
}
</script>
</body>
</html>
